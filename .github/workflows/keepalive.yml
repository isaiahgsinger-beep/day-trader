name: Keep alive

# GitHub switches off scheduled jobs in repos with no activity for 60 days.
# This makes a tiny empty commit twice a month so the trader never stops silently.
on:
  schedule:
    - cron: "23 12 1,15 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git commit --allow-empty -m "keepalive"
          git push
